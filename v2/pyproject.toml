[project]
name = "summer-gds-v2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0",
    "klayout>=0.28.0",
    "matplotlib>=3.5.0",
    "pywebview>=5.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
summer-gds-v2 = "summer_gds.cli:main"
summer-gds-v2-gui = "summer_gds.gui.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summer_gds"]

[tool.pytest.ini_options]
pythonpath = ["src"]
