[project]
name = "summer-gds"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0",
    "klayout>=0.28.0",
    "matplotlib>=3.5.0",
    "pyside6==6.11.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
packaging = [
    "pyinstaller==6.21.0",
]

[project.scripts]
summer-gds = "summer_gds.cli:main"
summer-gds-gui = "summer_gds.gui.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summer_gds"]
artifacts = [
  "src/summer_gds/gui/templates/**",
  "src/summer_gds/gui/static/**",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
