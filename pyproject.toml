[project]
name = "summer-gds"
version = "0.1.0"
description = "Summer-GDS MVP layout generator"
readme = "docs/refactor/MVP_PLAN.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=2.0.0",
    "flask-cors>=3.0.10",
    "klayout>=0.28.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "pyinstaller>=6.16.0",
    "pyyaml>=6.0",
    "pyside6>=6.7.0",
    "PySide6-Addons>=6.7.0",
    "werkzeug>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
summer-gds = "summer_gds.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
