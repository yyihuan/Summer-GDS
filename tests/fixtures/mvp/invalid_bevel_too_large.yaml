schema_version: 1

global:
  dbu: 0.001
  precision: null

gds:
  output_file: "bad_bevel.gds"
  cell_name: "TOP"
  default_layer: [1, 0]

shapes:
  - id: "main_pad"
    type: "base_shape"
    geometry_type: "polygon"
    vertices:
      - [0, 0]
      - [10, 0]
      - [10, 10]
      - [0, 10]
    fillet:
      mode: "bevel"
      distances: [6, 6, 6, 6]
