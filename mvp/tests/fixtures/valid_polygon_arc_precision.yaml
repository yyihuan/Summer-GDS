schema_version: 1

global:
  dbu: 0.001
  precision: null

gds:
  output_file: "valid_polygon_arc_precision.gds"
  cell_name: "TOP"
  default_layer: [1, 0]

shapes:
  - id: "precision_pad"
    type: "base_shape"
    geometry_type: "polygon"
    layer: [2, 0]
    vertices:
      - [0, 0]
      - [100, 0]
      - [100, 80]
      - [0, 80]
    fillet:
      radii: [5, 5, 5, 5]
      precision: 0.1
