    type: "base_shape"
    geometry_type: "polygon"
    layer: [2, 0]
    vertices:
      - [0, 0]
      - [10, 0]
      - [10, 10]
      - [0, 10]
    fillet:
      mode: "arc_v2"
      radii: [8, 8, 8, 8]
